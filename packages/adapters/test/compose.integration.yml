services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagebldr
      POSTGRES_PASSWORD: pagebldr
      POSTGRES_USER: pagebldr
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagebldr -d pagebldr"]
      interval: 2s
      timeout: 2s
      retries: 30

  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "pagebldr-rs", "--bind_ip_all"]
    ports:
      - "57017:27017"
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 30
